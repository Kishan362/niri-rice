# Mako configuration for GitHub Dark
background-color=#0d1117ee
text-color=#e6edf3
border-color=#58a6ff
border-radius=10
border-size=2
width=350
height=100
padding=10
margin=10
default-timeout=5000
max-visible=5
format=<b>{summary}</b>\n{body}
font=JetBrainsMono Nerd Font 11
markup=true

[urgency=low]
background-color=#161b22ee
text-color=#8b949e
border-color=#8b949e

[urgency=normal]
background-color=#0d1117ee
text-color=#e6edf3
border-color=#58a6ff

[urgency=critical]
background-color=#58a6ffee
text-color=#0d1117
border-color=#f78166
