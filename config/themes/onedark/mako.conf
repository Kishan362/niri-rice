# Mako configuration for One Dark
background-color=#282c34ee
text-color=#abb2bf
border-color=#61afef
border-radius=10
border-size=2
width=350
height=100
padding=10
margin=10
default-timeout=5000
max-visible=5
format=<b>{summary}</b>\n{body}
font=JetBrainsMono Nerd Font 11
markup=true

[urgency=low]
background-color=#3e4451ee
text-color=#5c6370
border-color=#5c6370

[urgency=normal]
background-color=#282c34ee
text-color=#abb2bf
border-color=#61afef

[urgency=critical]
background-color=#61afefee
text-color=#282c34
border-color=#c678dd
