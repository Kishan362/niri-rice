# Mako configuration for Solarized Dark
background-color=#002b36ee
text-color=#839496
border-color=#268bd2
border-radius=10
border-size=2
width=350
height=100
padding=10
margin=10
default-timeout=5000
max-visible=5
format=<b>{summary}</b>\n{body}
font=JetBrainsMono Nerd Font 11
markup=true

[urgency=low]
background-color=#073642ee
text-color=#586e75
border-color=#586e75

[urgency=normal]
background-color=#002b36ee
text-color=#839496
border-color=#268bd2

[urgency=critical]
background-color=#268bd2ee
text-color=#002b36
border-color=#b58900
