# Font (matches your Waybar font)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window padding & transparency (pairs with Niri rounded corners & prefer-no-csd)
window_padding_width     12
background_opacity       0.92
dynamic_background_opacity yes
hide_window_decorations  yes
confirm_os_window_close  0

# Cursor
cursor                  #ff2a55
cursor_text_color       #0b0a0e
cursor_shape            beam
cursor_beam_thickness   1.8
cursor_trail            1
cursor_trail_decay      0.1 0.3

# Core Obsidian & Crimson Palette
foreground              #f3f1f5
background              #0b0a0e
selection_foreground    #ffffff
selection_background    #9f1239

# URLs
url_color               #ff4d6d
url_style               curly

# Tab Bar (if you use Kitty tabs)
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #ffffff
active_tab_background   #b91c3c
active_tab_font_style   bold
inactive_tab_foreground #9e98a6
inactive_tab_background #16141a
tab_bar_background      #0b0a0e

# Terminal 16-Color ANSI Palette (Obsidian, Silver & Crimson accents)
# Black
color0  #16141a
color8  #4a4452

# Red (Primary Crimson Accent)
color1  #e11d48
color9  #ff2a55

# Green
color2  #10b981
color10 #34d399

# Yellow / Amber (matches your nightlight/warning icons)
color3  #f59e0b
color11 #fbbf24

# Blue / Slate
color4  #64748b
color12 #94a3b8

# Magenta / Rose
color5  #be185d
color13 #fb7185

# Cyan / Ice Silver
color6  #a1a1aa
color14 #e4e4e7

# White
color7  #dcd8e0
color15 #ffffff

# Performance & Shell Integration
repaint_delay           8
input_delay             2
sync_to_monitor         yes
enable_audio_bell       no
shell_integration       enabled
